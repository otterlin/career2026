
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114學年度 大雅國中畢業生升學就業視覺化分析</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --accent-glow: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --public-color: #10b981;
            --private-color: #3b82f6;
            --none-color: #ef4444;
            --day-color: #06b6d4;
            --night-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--card-border);
            transition: background 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-card.primary::before { background: var(--primary-glow); }
        .stat-card.accent::before { background: var(--accent-glow); }
        .stat-card.warning::before { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .stat-card.danger::before { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }

        .stat-card .label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-card .value {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            letter-spacing: -0.03em;
        }

        .stat-card .sub-value {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Dashboard Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(16px);
        }

        .chart-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 4px solid #3b82f6;
            padding-left: 0.75rem;
        }

        .col-4 { grid-column: span 4; }
        .col-6 { grid-column: span 6; }
        .col-12 { grid-column: span 12; }

        @media (max-width: 1024px) {
            .col-4, .col-6 { grid-column: span 12; }
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Explorer Section */
        .explorer-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(16px);
            margin-bottom: 2.5rem;
        }

        .explorer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .explorer-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            width: 260px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .class-filter {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #3b82f6;
            color: #fff;
            border-color: #3b82f6;
        }

        /* Table Styles */
        .table-container {
            overflow-x: auto;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.925rem;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }

        .badge.public {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--public-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge.private {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--private-color);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .badge.none {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--none-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge.day {
            background-color: rgba(6, 182, 212, 0.1);
            color: var(--day-color);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .badge.night {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--night-color);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pagination-info {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .pagination-nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--card-border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>114學年度 大雅國中畢業生升學就業視覺化分析</h1>
            <p>輔導室資料組製 • 數據分析與視覺化面板</p>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card primary">
                <div class="label">畢業總人數</div>
                <div class="value">336</div>
                <div class="sub-value">全校 13 個班級畢業生</div>
            </div>
            <div class="stat-card accent">
                <div class="label">升學學生人數</div>
                <div class="value">331</div>
                <div class="sub-value">升學率 98.51%</div>
            </div>
            <div class="stat-card danger">
                <div class="label">未升學未就業 / 自學</div>
                <div class="value">5</div>
                <div class="sub-value">佔比 1.49%</div>
            </div>
            <div class="stat-card accent">
                <div class="label">公立學校就讀人數</div>
                <div class="value">225</div>
                <div class="sub-value">升學者就讀公立比例 67.98%</div>
            </div>
            <div class="stat-card primary">
                <div class="label">私立學校就讀人數</div>
                <div class="value">106</div>
                <div class="sub-value">升學者就讀私立比例 32.02%</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="dashboard-grid">
            <!-- Public vs Private -->
            <div class="chart-card col-4">
                <h3>公私立學校分布 <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">（含未升學）</span></h3>
                <div class="chart-container">
                    <canvas id="pubPrivChart"></canvas>
                </div>
            </div>

            <!-- Day vs Night -->
            <div class="chart-card col-4">
                <h3>日間部 vs 進修部/夜間部 <span style="font-size:0.8rem; font-weight:normal; color:var(--text-muted);">（含未升學）</span></h3>
                <div class="chart-container">
                    <canvas id="dayNightChart"></canvas>
                </div>
            </div>

            <!-- Admission Channels -->
            <div class="chart-card col-4">
                <h3>入學管道分布</h3>
                <div class="chart-container">
                    <canvas id="channelChart"></canvas>
                </div>
            </div>

            <!-- Top Schools -->
            <div class="chart-card col-6">
                <h3>熱門升學學校 Top 12</h3>
                <div class="chart-container" style="height: 420px;">
                    <canvas id="topSchoolsChart"></canvas>
                </div>
            </div>

            <!-- Clusters Distribution -->
            <div class="chart-card col-6">
                <h3>升學職群與學程分布</h3>
                <div class="chart-container" style="height: 420px;">
                    <canvas id="clusterChart"></canvas>
                </div>
            </div>
        </div>

        

        <footer>
            <p>© 115學年度資料組大雅國中升學追蹤系統 • 網頁分析面板系統</p>
        </footer>
    </div>

    <!-- Data Injection -->
    <script>
        

        // -------------------------------------------------------------
        // Charts Configuration
        // -------------------------------------------------------------
        Chart.defaults.color = '#9ca3af';
        Chart.defaults.font.family = "'Inter', 'Noto Sans TC', sans-serif";

        // Chart 1: Public vs Private
        const ctxPub = document.getElementById('pubPrivChart').getContext('2d');
        new Chart(ctxPub, {
            type: 'doughnut',
            data: {
                labels: ['公立學校', '私立學校', '不升學'],
                datasets: [{
                    data: [225, 106, 5],
                    backgroundColor: ['#10b981', '#3b82f6', '#ef4444'],
                    borderWidth: 1,
                    borderColor: 'rgba(255, 255, 255, 0.1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 15 } }
                }
            }
        });

        // Chart 2: Day vs Night
        const ctxDay = document.getElementById('dayNightChart').getContext('2d');
        new Chart(ctxDay, {
            type: 'doughnut',
            data: {
                labels: ['日間部', '進修部/夜間部', '不升學'],
                datasets: [{
                    data: [324, 7, 5],
                    backgroundColor: ['#06b6d4', '#f59e0b', '#ef4444'],
                    borderWidth: 1,
                    borderColor: 'rgba(255, 255, 255, 0.1)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { padding: 15 } }
                }
            }
        });

        // Chart 3: Admission Channels
        const ctxChan = document.getElementById('channelChart').getContext('2d');
        new Chart(ctxChan, {
            type: 'bar',
            data: {
                labels: ["高中免試(日)", "產學/建教班", "自行報名/續招", "五專免試", "十二年就學安置", "體育班/運動績優", "實用技能學程", "高中免試(夜)", "藝才班特招", "專業群科甄選", "技優甄審", "獨立招生"],
                datasets: [{
                    label: '學生人數',
                    data: [253, 13, 11, 10, 8, 6, 6, 6, 6, 3, 2, 2],
                    backgroundColor: 'rgba(6, 182, 212, 0.7)',
                    borderColor: '#06b6d4',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                    y: { grid: { display: false } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // Chart 4: Top Schools (Headcount Top 12)
        const ctxTop = document.getElementById('topSchoolsChart').getContext('2d');
        new Chart(ctxTop, {
            type: 'bar',
            data: {
                labels: ["私立新民高中", "市立沙鹿高工", "市立西苑高中", "市立后綜高中", "市立豐原高商", "市立臺中高工", "市立神岡高工", "市立豐原高中", "私立僑泰高中", "市立文華高中", "市立大甲高工", "市立臺中二中"],
                datasets: [{
                    label: '學生人數',
                    data: [32, 23, 19, 17, 16, 15, 15, 14, 14, 11, 10, 10],
                    backgroundColor: 'rgba(59, 130, 246, 0.7)',
                    borderColor: '#3b82f6',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' } },
                    y: { grid: { display: false } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // Chart 5: Clusters Distribution
        const ctxClus = document.getElementById('clusterChart').getContext('2d');
        new Chart(ctxClus, {
            type: 'bar',
            data: {
                labels: ["普通科", "電機電子", "機械群", "商管群", "餐旅群", "設計群", "特教", "醫護群", "家政群", "外語群", "化工群", "動機群", "土建群", "藝術群", "體育專班", "農業群", "食品群"],
                datasets: [{
                    label: '學生人數',
                    data: [146, 39, 27, 26, 20, 29, 4, 11, 9, 8, 0, 5, 0, 2, 2, 2, 1],
                    backgroundColor: 'rgba(139, 92, 246, 0.7)',
                    borderColor: '#8b5cf6',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { display: false } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.05)' } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    </script>
</body>
</html>
